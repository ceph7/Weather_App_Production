name: weather_app
description: "Application météo Flutter connectée à OpenWeatherMap — Auth JWT, cache Hive, mode hors-ligne."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local storage / cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Auth (JWT generation for the mock auth backend)
  dart_jsonwebtoken: ^2.14.0
  crypto: ^3.0.3

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
